<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Đăng Ký - TasteOfJoy</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { 
            height: 100vh; display: flex; justify-content: center; align-items: center; 
            background: linear-gradient(135deg, #ff7e5f, #feb47b);
        }
        .auth-container {
            background: white; padding: 40px; border-radius: 12px; box-shadow: 0 10px 25px rgba(0,0,0,0.2);
            width: 100%; max-width: 450px; text-align: center; animation: fadeIn 0.5s ease;
        }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(-20px); } to { opacity: 1; transform: translateY(0); } }
        
        .logo { font-size: 2rem; color: #ff7e5f; margin-bottom: 10px; }
        h2 { color: #333; margin-bottom: 20px; font-size: 1.8rem; }
        
        .form-group { margin-bottom: 15px; text-align: left; position: relative; }
        .form-group label { display: block; margin-bottom: 5px; color: #555; font-weight: bold; font-size: 0.9rem; }
        .form-group input { 
            width: 100%; padding: 12px; border: 1px solid #ddd; border-radius: 6px; 
            font-size: 1rem; transition: 0.3s; 
        }
        .form-group input:focus { border-color: #ff7e5f; outline: none; box-shadow: 0 0 5px rgba(255, 126, 95, 0.3); }
        .form-group input.is-invalid { border-color: #f44336; background-color: #ffebee; }
        
        /* Chữ thông báo lỗi nhỏ dưới mỗi ô input */
        .error-text { color: #f44336; font-size: 0.8rem; margin-top: 5px; display: none; }
        
        .btn { 
            width: 100%; padding: 12px; background: #ff7e5f; color: white; border: none; 
            border-radius: 6px; font-size: 1.1rem; font-weight: bold; cursor: pointer; 
            transition: 0.3s; margin-top: 10px; display: flex; justify-content: center; align-items: center;
        }
        .btn:hover { background: #e06c50; }
        .btn:disabled { background: #ccc; cursor: not-allowed; }
        
        .links { margin-top: 20px; font-size: 0.9rem; color: #666; display: flex; justify-content: center; }
        .links a { color: #ff7e5f; text-decoration: none; font-weight: bold; margin-left: 5px; transition: 0.2s; }
        .links a:hover { text-decoration: underline; }
        
        .back-home { display: inline-block; margin-top: 20px; color: #888; text-decoration: none; font-size: 0.9rem; }
        .back-home:hover { color: #333; }
    </style>
</head>
<body>

    <div class="auth-container">
        <div class="logo"><i class="fas fa-ice-cream"></i></div>
        <h2>Tạo tài khoản mới</h2>
        
        <form id="signup-form" onsubmit="handleSignup(event)" novalidate>
            <div class="form-group">
                <label>Họ và Tên</label>
                <input type="text" id="signup-name" placeholder="Ví dụ: Nguyễn Văn A">
                <div class="error-text" id="err-name">Vui lòng nhập họ tên hợp lệ (không chứa số)!</div>
            </div>
            
            <div class="form-group">
                <label>Email</label>
                <input type="email" id="signup-email" placeholder="Nhập email của bạn">
                <div class="error-text" id="err-email">Email không đúng định dạng!</div>
            </div>
            
            <div class="form-group">
                <label>Mật khẩu</label>
                <input type="password" id="signup-password" placeholder="Ít nhất 6 ký tự">
                <div class="error-text" id="err-pass">Mật khẩu phải có ít nhất 6 ký tự!</div>
            </div>
            
            <div class="form-group">
                <label>Xác nhận Mật khẩu</label>
                <input type="password" id="signup-confirm" placeholder="Nhập lại mật khẩu">
                <div class="error-text" id="err-confirm">Mật khẩu xác nhận không khớp!</div>
            </div>
            
            <button type="submit" class="btn" id="btn-submit">Đăng Ký</button>
        </form>
        
        <div class="links">
            <span>Đã có tài khoản?</span> <a href="../login/login.html">Đăng nhập ngay</a>
        </div>
        <a href="../" class="back-home"><i class="fas fa-arrow-left"></i> Về trang chủ</a>
    </div>

    <script>
        const USER_API = '../api/users';

        // Hàm Reset lỗi (xóa viền đỏ và ẩn text)
        function clearErrors() {
            document.querySelectorAll('.error-text').forEach(el => el.style.display = 'none');
            document.querySelectorAll('input').forEach(el => el.classList.remove('is-invalid'));
        }

        // Hàm hiển thị lỗi cho một ô cụ thể
        function showError(inputId, errorId) {
            document.getElementById(inputId).classList.add('is-invalid');
            document.getElementById(errorId).style.display = 'block';
        }

        async function handleSignup(event) {
            event.preventDefault(); // Ngăn trình duyệt load lại trang
            clearErrors(); // Xóa các lỗi cũ mỗi lần bấm nút
            
            // Lấy dữ liệu và loại bỏ khoảng trắng dư thừa ở đầu/cuối
            const fullname = document.getElementById('signup-name').value.trim();
            const email = document.getElementById('signup-email').value.trim();
            const password = document.getElementById('signup-password').value;
            const confirmPass = document.getElementById('signup-confirm').value;
            
            let isValid = true;

            // 1. Validate Họ Tên: Không được rỗng
            if (fullname.length < 2) {
                showError('signup-name', 'err-name');
                isValid = false;
            }

            // 2. Validate Email bằng Regex (Biểu thức chính quy)
            const emailRegex = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
            if (!emailRegex.test(email)) {
                showError('signup-email', 'err-email');
                isValid = false;
            }

            // 3. Validate Mật khẩu (Ít nhất 6 ký tự)
            if (password.length < 6) {
                showError('signup-password', 'err-pass');
                isValid = false;
            }

            // 4. Validate Khớp mật khẩu
            if (password !== confirmPass || confirmPass === "") {
                showError('signup-confirm', 'err-confirm');
                isValid = false;
            }

            // Nếu có bất kỳ lỗi nào thì DỪNG LẠI, không gọi API
            if (!isValid) return;

            // ============================================
            // NẾU PASS VALIDATION THÌ BẮT ĐẦU GỌI API
            // ============================================
            
            const btnSubmit = document.getElementById('btn-submit');
            btnSubmit.disabled = true; // Vô hiệu hóa nút để tránh spam click
            btnSubmit.innerHTML = '<i class="fas fa-spinner fa-spin"></i> &nbsp; Đang xử lý...';

            const payload = {
                fullname: fullname,
                email: email,
                password: password,
                role: 0
            };

            try {
                const res = await fetch(USER_API, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });

                if (res.ok) {
                    alert("Đăng ký thành công! Đang chuyển hướng đến trang Đăng nhập...");
                    window.location.href = '../login/login.html';
                } else {
                    // Xử lý trường hợp Backend báo lỗi (ví dụ: Trùng email)
                    showError('signup-email', 'err-email');
                    document.getElementById('err-email').innerText = "Email này đã được sử dụng!";
                }
            } catch (error) {
                console.error("Lỗi:", error);
                alert("Lỗi kết nối máy chủ! Vui lòng thử lại sau.");
            } finally {
                // Trả lại trạng thái ban đầu cho nút bấm dù thành công hay thất bại
                btnSubmit.disabled = false;
                btnSubmit.innerHTML = 'Đăng Ký';
            }
        }
    </script>
</body>
</html>
