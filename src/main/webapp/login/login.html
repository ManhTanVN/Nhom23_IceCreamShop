<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Đăng Nhập - TasteOfJoy</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { 
            height: 100vh; display: flex; justify-content: center; align-items: center; 
            background: linear-gradient(135deg, #ff7e5f, #feb47b); /* Tông màu cam đào đặc trưng */
        }
        .auth-container {
            background: white; padding: 40px; border-radius: 12px; box-shadow: 0 10px 25px rgba(0,0,0,0.2);
            width: 100%; max-width: 400px; text-align: center; animation: fadeIn 0.5s ease;
        }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(-20px); } to { opacity: 1; transform: translateY(0); } }
        
        .logo { font-size: 2rem; color: #ff7e5f; margin-bottom: 10px; }
        h2 { color: #333; margin-bottom: 20px; font-size: 1.8rem; }
        
        .form-group { margin-bottom: 15px; text-align: left; }
        .form-group label { display: block; margin-bottom: 5px; color: #555; font-weight: bold; font-size: 0.9rem; }
        .form-group input { 
            width: 100%; padding: 12px; border: 1px solid #ddd; border-radius: 6px; 
            font-size: 1rem; transition: 0.3s; 
        }
        .form-group input:focus { border-color: #ff7e5f; outline: none; box-shadow: 0 0 5px rgba(255, 126, 95, 0.3); }
        
        .btn { 
            width: 100%; padding: 12px; background: #ff7e5f; color: white; border: none; 
            border-radius: 6px; font-size: 1.1rem; font-weight: bold; cursor: pointer; 
            transition: 0.3s; margin-top: 10px; 
        }
        .btn:hover { background: #e06c50; }
        
        .links { margin-top: 20px; font-size: 0.9rem; color: #666; display: flex; justify-content: space-between; }
        .links a { color: #ff7e5f; text-decoration: none; font-weight: bold; transition: 0.2s; }
        .links a:hover { text-decoration: underline; }
        
        .back-home { display: inline-block; margin-top: 20px; color: #888; text-decoration: none; font-size: 0.9rem; }
        .back-home:hover { color: #333; }
    </style>
</head>
<body>

    <div class="auth-container">
        <div class="logo"><i class="fas fa-ice-cream"></i></div>
        <h2>Chào mừng trở lại!</h2>
        
        <form id="login-form" onsubmit="handleLogin(event)">
            <div class="form-group">
                <label>Email</label>
                <input type="email" id="login-email" placeholder="Nhập email của bạn" required>
            </div>
            <div class="form-group">
                <label>Mật khẩu</label>
                <input type="password" id="login-password" placeholder="Nhập mật khẩu" required>
            </div>
            <button type="submit" class="btn">Đăng Nhập</button>
        </form>
        
        <div class="links">
            <span>Chưa có tài khoản? <a href="../signup/signup.html">Đăng ký ngay</a></span>
        </div>
        <a href="../" class="back-home"><i class="fas fa-arrow-left"></i> Về trang chủ</a>
    </div>

    <script>
        const LOGIN_API = '../api/login'; // Gọi API kiểm tra đăng nhập

        async function handleLogin(event) {
            event.preventDefault(); // Ngăn form load lại trang
            
            const email = document.getElementById('login-email').value;
            const pass = document.getElementById('login-password').value;
            const btn = document.querySelector('.btn');

            // Đổi giao diện nút bấm trong lúc chờ Server
            btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Đang xử lý...';
            btn.disabled = true;
            
            try {
                const response = await fetch(LOGIN_API, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email: email, password: pass })
                });

                if (response.ok) {
                    // Nếu Server trả về 200 OK -> Lấy thông tin user
                    const user = await response.json();
                    
                    // LƯU TRẠNG THÁI ĐĂNG NHẬP VÀO BỘ NHỚ TRÌNH DUYỆT
                    localStorage.setItem('currentUser', JSON.stringify({
                        id: user.id,
                        fullname: user.fullname,
                        role: user.role
                    }));

                    // CHUYỂN HƯỚNG VỀ TRANG CHỦ
                    window.location.href = '../home';
                } else {
                    // Nếu Server trả về lỗi (401)
                    alert("Sai email hoặc mật khẩu! Vui lòng thử lại.");
                    btn.innerHTML = 'Đăng Nhập';
                    btn.disabled = false;
                }
            } catch (error) {
                console.error("Lỗi:", error);
                alert("Không thể kết nối đến máy chủ!");
                btn.innerHTML = 'Đăng Nhập';
                btn.disabled = false;
            }
        }
    </script>
</body>
</html>
