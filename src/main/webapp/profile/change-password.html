<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Đổi mật khẩu - TasteOfJoy</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', sans-serif; }
        body { height: 100vh; display: flex; justify-content: center; align-items: center; background: linear-gradient(135deg, #ff7e5f, #feb47b); }
        .form-card { background: white; padding: 40px; border-radius: 12px; box-shadow: 0 10px 25px rgba(0,0,0,0.2); width: 100%; max-width: 400px; animation: fadeIn 0.5s ease; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(-20px); } to { opacity: 1; transform: translateY(0); } }
        
        h2 { color: #333; margin-bottom: 20px; text-align: center; }
        .form-group { margin-bottom: 20px; }
        .form-group label { display: block; margin-bottom: 8px; color: #555; font-weight: bold; }
        .form-group input { width: 100%; padding: 12px; border: 1px solid #ddd; border-radius: 6px; font-size: 1rem; transition: 0.3s; }
        .form-group input:focus { border-color: #ff7e5f; outline: none; box-shadow: 0 0 5px rgba(255, 126, 95, 0.3); }
        .error-txt { color: red; font-size: 0.85rem; display: none; margin-top: 5px; }
        
        .btn-save { width: 100%; padding: 12px; background: #ff7e5f; color: white; border: none; border-radius: 6px; font-size: 1.1rem; font-weight: bold; cursor: pointer; transition: 0.3s; }
        .btn-save:hover { background: #e06c50; }
        .back-link { display: block; text-align: center; margin-top: 20px; color: #888; text-decoration: none; }
        .back-link:hover { color: #333; }
    </style>
</head>
<body>

    <div class="form-card">
        <h2><i class="fas fa-lock"></i> Đổi mật khẩu</h2>
        
        <form id="pass-form" onsubmit="handleChangePass(event)">
            <div class="form-group">
                <label>Mật khẩu mới</label>
                <input type="password" id="new-pass" required minlength="6">
            </div>
            <div class="form-group">
                <label>Xác nhận mật khẩu mới</label>
                <input type="password" id="confirm-pass" required>
                <div id="err-msg" class="error-txt">Mật khẩu không khớp!</div>
            </div>
            <button type="submit" class="btn-save">Cập nhật Mật khẩu</button>
        </form>
        
        <a href="profile.html" class="back-link"><i class="fas fa-arrow-left"></i> Quay lại Hồ sơ</a>
    </div>

    <script>
        if (!localStorage.getItem('currentUser')) window.location.href = '../login/login.html';

        function handleChangePass(event) {
            event.preventDefault();
            const newPass = document.getElementById('new-pass').value;
            const confirmPass = document.getElementById('confirm-pass').value;
            const errMsg = document.getElementById('err-msg');
            
            if (newPass !== confirmPass) {
                errMsg.style.display = 'block';
                return;
            }
            errMsg.style.display = 'none';

            alert("Giao diện đổi mật khẩu đã sẵn sàng! (Cần nối API để cập nhật xuống MySQL)");
            window.location.href = 'profile.html';
        }
    </script>
</body>
</html>
