<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chỉnh sửa thông tin - TasteOfJoy</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', sans-serif; }
        body { height: 100vh; display: flex; justify-content: center; align-items: center; background: linear-gradient(135deg, #ff7e5f, #feb47b); }
        .form-card { background: white; padding: 40px; border-radius: 12px; box-shadow: 0 10px 25px rgba(0,0,0,0.2); width: 100%; max-width: 400px; animation: fadeIn 0.5s ease; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(-20px); } to { opacity: 1; transform: translateY(0); } }
        
        h2 { color: #333; margin-bottom: 20px; text-align: center; }
        .form-group { margin-bottom: 20px; }
        .form-group label { display: block; margin-bottom: 8px; color: #555; font-weight: bold; }
        .form-group input { width: 100%; padding: 12px; border: 1px solid #ddd; border-radius: 6px; font-size: 1rem; transition: 0.3s; }
        .form-group input:focus { border-color: #ff7e5f; outline: none; box-shadow: 0 0 5px rgba(255, 126, 95, 0.3); }
        
        .btn-save { width: 100%; padding: 12px; background: #ff7e5f; color: white; border: none; border-radius: 6px; font-size: 1.1rem; font-weight: bold; cursor: pointer; transition: 0.3s; }
        .btn-save:hover { background: #e06c50; }
        .back-link { display: block; text-align: center; margin-top: 20px; color: #888; text-decoration: none; }
        .back-link:hover { color: #333; }
    </style>
</head>
<body>

    <div class="form-card">
        <h2><i class="fas fa-user-edit"></i> Đổi tên hiển thị</h2>
        
        <form id="edit-form" onsubmit="handleUpdate(event)">
            <div class="form-group">
                <label>Họ và tên mới</label>
                <input type="text" id="new-name" required>
            </div>
            <button type="submit" class="btn-save">Lưu thay đổi</button>
        </form>
        
        <a href="profile.html" class="back-link"><i class="fas fa-arrow-left"></i> Quay lại Hồ sơ</a>
    </div>

    <script>
        const userStr = localStorage.getItem('currentUser');
        if (!userStr) window.location.href = '../login/login.html';
        
        // Điền sẵn tên cũ vào ô input
        const user = JSON.parse(userStr);
        document.getElementById('new-name').value = user.fullname;

        function handleUpdate(event) {
            event.preventDefault();
            const newName = document.getElementById('new-name').value.trim();
            
            if(newName.length < 2) {
                alert("Tên phải có ít nhất 2 ký tự!"); return;
            }

            // Cập nhật vào LocalStorage trước để giao diện đổi ngay lập tức
            user.fullname = newName;
            localStorage.setItem('currentUser', JSON.stringify(user));
            
            alert("Cập nhật tên thành công!");
            window.location.href = 'profile.html';

            /* TODO: Sau này bạn gọi API PUT ../api/users ở đây để báo cho Database MySQL biết nhé */
        }
    </script>
</body>
</html>
